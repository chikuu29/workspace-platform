# Kubernetes SPA-only nginx config.
#
# In Kubernetes, the NGINX Ingress Controller (outside this container)
# handles all /api/ routing to workspace-backend:8001.
# This container only needs to serve the built React static files.
# No upstream proxy block is needed here.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with caching headers
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # All other routes return index.html (React Router SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
